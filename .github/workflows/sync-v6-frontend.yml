name: Sync v6 mobile frontend

on:
  push:
    branches: [main]
    paths:
      - 'release/frontend-v6.b64.part*'
      - '.github/workflows/sync-v6-frontend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild v6 frontend bundle
        run: |
          cat release/frontend-v6.b64.part* > /tmp/frontend-v6.b64
          base64 -d /tmp/frontend-v6.b64 > /tmp/frontend-v6.tar.gz
          tar -xzf /tmp/frontend-v6.tar.gz
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          if git diff --cached --quiet; then
            echo "Frontend already synchronized"
          else
            git commit -m "feat: sync interactive mobile v6 frontend"
            git push origin main
          fi
